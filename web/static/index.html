<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЗАТО.Вход — единое окно въезда</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">ЗАТО.Вход <span id="city"></span></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="plan" aria-selected="true">Дорожная карта</button>
    <button role="tab" data-tab="check" aria-selected="false">Предпроверка пакета</button>
    <button role="tab" data-tab="cabinet" aria-selected="false">Кабинет и продления</button>
  </nav>
</header>

<main>
  <section id="tab-plan">
    <div class="layout">
      <form id="plan-form" class="panel">
        <div class="seg" id="scenarios" role="radiogroup" aria-label="Основание въезда"></div>
        <p class="muted" id="scenario-desc"></p>
        <label class="field">Дата старта
          <input type="date" id="start-date">
        </label>
        <fieldset id="questions"><legend>Анкета</legend></fieldset>
        <fieldset id="sliders"><legend>Сроки задаёт эксперт</legend></fieldset>
        <label class="check"><input type="checkbox" id="show-assumptions"> Подсветить допущения</label>
        <button type="submit">Сохранить план</button>
        <div id="plan-saved" aria-live="polite"></div>
      </form>

      <div class="result">
        <div class="notice" id="plan-notice" hidden></div>
        <div class="hero" id="hero" aria-live="polite"></div>
        <div class="first" id="first-action"></div>
        <div class="steps" id="steps"></div>
        <ul class="limits" id="limits"></ul>
      </div>
    </div>
  </section>

  <section id="tab-check" hidden>
    <div class="layout">
      <form id="check-form" class="panel" autocomplete="off">
        <label class="field">Вид пропуска <select id="pass-type"></select></label>
        <label class="field">Желаемая дата въезда <input type="date" id="entry-date"></label>
        <p class="muted">Пакет проверяется и нигде не сохраняется. Пример заполняется сгенерированными данными.</p>
        <div class="row">
          <button type="submit">Проверить пакет</button>
          <button type="button" class="ghost" id="add-person">Добавить человека</button>
          <button type="button" class="ghost" id="sample-persons">Пример</button>
        </div>
        <div id="check-summary" aria-live="polite"></div>
      </form>
      <div class="result" id="persons"></div>
    </div>
  </section>

  <section id="tab-cabinet" hidden>
    <div id="cabinet"></div>
  </section>
</main>

<footer class="foot" id="disclaimer"></footer>
<script src="app.js"></script>
</body>
</html>
